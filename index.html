<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>I'm High on Crack and I Have a Gun</title>
  <style>
    :root {
      --bg: #040404;
      --text: #f2eadf;
      --muted: #c8b29a;
      --line: rgba(255,255,255,.10);
      --panel: rgba(0,0,0,.52);
      --paper: #eadcc4;
      --ink: #2b2118;
      --shadow: 0 30px 90px rgba(0,0,0,.55);
      --shadow-deep: 0 50px 140px rgba(0,0,0,.78);
      --danger: #9c2d24;
      --warm: #daac72;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: #000;
      color: var(--text);
      font-family: Georgia, "Times New Roman", serif;
    }
    body { overflow: hidden; }
    button, a { font: inherit; }
    a { color: inherit; text-decoration: none; }

    .app {
      position: relative;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #000;
    }

    .grain, .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 200;
    }
    .grain {
      opacity: .05;
      background-image:
        linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
      background-size: 4px 4px;
      mix-blend-mode: soft-light;
    }
    .vignette {
      box-shadow: inset 0 0 220px rgba(0,0,0,.78);
    }

    .scene {
      position: absolute;
      inset: 0;
      opacity: 0;
      pointer-events: none;
      transition: opacity 1s ease, transform 1s ease;
      transform: scale(1.01);
    }
    .scene.show {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1);
    }

    .pill {
      border: 1px solid var(--line);
      background: rgba(0,0,0,.48);
      color: var(--muted);
      border-radius: 999px;
      padding: 10px 14px;
      text-transform: uppercase;
      letter-spacing: .14em;
      font-size: 12px;
      backdrop-filter: blur(10px);
    }

    .reset {
      position: fixed;
      top: 16px;
      right: 16px;
      z-index: 220;
      cursor: pointer;
      border: none;
    }

    .audio-toggle {
      position: fixed;
      top: 16px;
      left: 16px;
      z-index: 220;
      cursor: pointer;
      color: #fff;
      border: none;
    }

    .hint {
      position: fixed;
      left: 50%;
      bottom: 14px;
      transform: translateX(-50%);
      z-index: 220;
      max-width: 92vw;
      text-align: center;
      pointer-events: none;
    }

    .hidden { display: none !important; }

    /* ===================== OPENING SCENE ===================== */
    .pickup-scene {
      background:
        linear-gradient(180deg, rgba(0,0,0,.16), rgba(0,0,0,.58)),
        url('ticket-collage.png') center center / 680px auto repeat,
        #050505;
    }

    .bg-video-wrap {
      position: absolute;
      inset: 0;
      overflow: hidden;
    }
    .bg-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: .75;
      filter: brightness(.62) contrast(1.04) saturate(.88);
      transform: scale(1.04);
    }
    .video-darkener {
      position: absolute;
      inset: 0;
      z-index: 2;
      background:
        linear-gradient(180deg, rgba(0,0,0,.42), rgba(0,0,0,.66)),
        radial-gradient(circle at center, transparent 0%, rgba(0,0,0,.18) 48%, rgba(0,0,0,.62) 100%);
    }

    .banner-wrap {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      width: min(1500px, 94vw);
      z-index: 10;
      pointer-events: none;
    }
    .site-banner {
      width: 100%;
      display: block;
      border-radius: 20px;
      box-shadow: var(--shadow);
      border: 1px solid rgba(255,255,255,.06);
      background: rgba(0,0,0,.30);
    }

    /* Ticket */
    .ground-ticket {
      position: absolute;
      left: 50%;
      bottom: 7vh;
      transform: translateX(-50%) rotate(-6deg);
      width: min(760px, 82vw);
      aspect-ratio: 2.05 / 1;
      border-radius: 24px;
      overflow: hidden;
      background: #000;
      z-index: 12;
      cursor: pointer;
      box-shadow: var(--shadow-deep), 0 0 60px rgba(218,172,114,.18);
      transition: transform .8s ease, opacity 1s ease, box-shadow .6s ease;
      animation: ticketGlow 2.8s ease-in-out infinite alternate;
    }
    @keyframes ticketGlow {
      from { box-shadow: var(--shadow-deep), 0 0 30px rgba(218,172,114,.10); }
      to   { box-shadow: var(--shadow-deep), 0 0 80px rgba(218,172,114,.32); }
    }
    .ground-ticket:hover, .ground-ticket:focus {
      transform: translateX(-50%) rotate(-4deg) translateY(-10px) scale(1.02);
      box-shadow: 0 62px 160px rgba(0,0,0,.8), 0 0 80px rgba(218,172,114,.32);
    }
    .ground-ticket img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .pickup-scene.animate-out .ground-ticket {
      transform: translateX(-50%) translateY(-34vh) scale(.48) rotate(-2deg);
      opacity: .04;
    }

    /* Mobile CTA — pickup */
    .pickup-cta-bar {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      bottom: calc(7vh + min(76px, 20vw) + 28px);
      z-index: 30;
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0,0,0,.60);
      border: 1px solid rgba(218,172,114,.35);
      border-radius: 999px;
      padding: 12px 22px;
      backdrop-filter: blur(12px);
      animation: ctaPulse 2s ease-in-out infinite;
      white-space: nowrap;
    }
    @keyframes ctaPulse {
      0%, 100% { opacity: .88; }
      50% { opacity: 1; box-shadow: 0 0 28px rgba(218,172,114,.22); }
    }
    .pickup-cta-bar .arrow { font-size: 18px; animation: arrowBounce 1.4s ease-in-out infinite; }
    @keyframes arrowBounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(4px); }
    }
    .pickup-cta-bar .label {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--warm);
    }

    /* ===================== ATM SCENE ===================== */
    .atm-scene {
      display: grid;
      place-items: center;
      background: linear-gradient(180deg, #040404, #090909);
    }
    .atm-stage {
      position: absolute;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 18px;
    }
    .atm-machine {
      position: relative;
      width: min(1000px, 94vw);
      aspect-ratio: .92 / 1;
      border-radius: 28px;
      overflow: hidden;
      background: #000;
      box-shadow: var(--shadow-deep);
      animation: atmZoom 9s ease-in-out infinite alternate;
    }
    @keyframes atmZoom {
      from { transform: scale(1); }
      to { transform: scale(1.016); }
    }
    .atm-machine > img:first-child {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .atm-overlay {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(255,255,255,.02), transparent 18%, transparent 82%, rgba(255,255,255,.02)),
        radial-gradient(circle at 25% 42%, rgba(140,255,230,.10), transparent 12%),
        radial-gradient(circle at 57% 58%, rgba(255,210,120,.10), transparent 7%);
      pointer-events: none;
    }

    .atm-ticket {
      position: absolute;
      left: 50%;
      bottom: 14%;
      transform: translateX(-50%) rotate(-2deg);
      width: min(430px, 44vw);
      aspect-ratio: 2.05 / 1;
      border-radius: 18px;
      overflow: hidden;
      background: #000;
      z-index: 10;
      box-shadow: 0 20px 60px rgba(0,0,0,.56);
      transition: transform 1.9s cubic-bezier(.18,.84,.2,1), opacity 1s ease;
    }
    .atm-ticket img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .atm-scene.animate-insert .atm-ticket {
      transform: translateX(-50%) translateY(-12%) scale(.72) rotate(-1deg);
      opacity: .98;
    }
    .atm-scene.finish-insert .atm-ticket {
      transform: translateX(-50%) translateY(-28%) scale(.28) rotate(-1deg);
      opacity: .03;
    }

    /* DVD */
    .dvd {
      position: absolute;
      left: 50%;
      bottom: 4.5%;
      width: min(380px, 32vw);
      aspect-ratio: .72 / 1;
      transform: translate(-50%, 230%) rotateX(55deg) scale(.82);
      transform-origin: center center;
      transition: transform 1.8s cubic-bezier(.2,.8,.2,1), opacity 1s ease;
      opacity: 0;
      perspective: 2200px;
      z-index: 12;
    }
    .atm-scene.reveal-dvd .dvd {
      transform: translate(-50%, 0%) rotateX(6deg) scale(1);
      opacity: 1;
    }

    .case {
      position: relative;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      cursor: pointer;
    }
    .case-front, .case-inside {
      position: absolute;
      inset: 0;
      border-radius: 18px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: var(--shadow);
      background: #000;
      backface-visibility: hidden;
    }
    .case-front img, .case-inside img {
      width: 100%;
      height: 100%;
      display: block;
    }
    .case-front img { object-fit: cover; }
    .case-inside {
      display: grid;
      place-items: center;
      padding: 10px;
      background:
        radial-gradient(circle at center, rgba(255,255,255,.03), transparent 38%),
        linear-gradient(180deg, #070707, #020202);
    }
    .case-inside img {
      object-fit: contain;
      object-position: center;
      padding: 6px;
      background: #050505;
      border-radius: 14px;
    }
    .case-front {
      transform-origin: left center;
      transition: transform 2.2s cubic-bezier(.18,.82,.18,1);
      z-index: 4;
    }
    .case.open .case-front { transform: rotateY(-132deg); }

    /* Enter archive — inside case (desktop) */
    .case-enter {
      position: absolute;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      z-index: 7;
      opacity: 0;
      pointer-events: none;
      transition: opacity .9s ease .55s;
      cursor: pointer;
      border: 1px solid rgba(218,172,114,.50);
      background: rgba(0,0,0,.72);
      color: var(--warm);
      border-radius: 999px;
      padding: 10px 18px;
      text-transform: uppercase;
      letter-spacing: .14em;
      font-size: 13px;
      backdrop-filter: blur(10px);
      white-space: nowrap;
    }
    .case.open .case-enter {
      opacity: 1;
      pointer-events: auto;
    }

    /* Mobile DVD CTA overlay — shown after DVD appears, outside ATM box */
    .dvd-cta-overlay {
      position: absolute;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      background: rgba(0,0,0,.70);
      border: 1px solid rgba(218,172,114,.40);
      border-radius: 999px;
      padding: 14px 28px;
      backdrop-filter: blur(12px);
      text-align: center;
      white-space: nowrap;
      animation: ctaPulse 2s ease-in-out infinite;
      pointer-events: none;
    }
    .dvd-cta-overlay .label {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--warm);
    }

    /* Enter Archive overlay — shown after case opens, outside case */
    .enter-archive-overlay {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 35;
      opacity: 0;
      pointer-events: none;
      transition: opacity .8s ease;
    }
    .enter-archive-overlay.visible {
      opacity: 1;
      pointer-events: auto;
    }
    .enter-archive-overlay button {
      border: 1px solid rgba(218,172,114,.60);
      background: rgba(0,0,0,.82);
      color: var(--warm);
      border-radius: 999px;
      padding: 16px 36px;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: .16em;
      font-size: 14px;
      font-weight: 700;
      backdrop-filter: blur(12px);
      white-space: nowrap;
      box-shadow: 0 0 30px rgba(218,172,114,.18);
      transition: background .3s, box-shadow .3s;
    }
    .enter-archive-overlay button:hover {
      background: rgba(20,14,5,.90);
      box-shadow: 0 0 50px rgba(218,172,114,.30);
    }

    /* ===================== THREADS SCENE ===================== */
    .cloud-scene {
      display: block;
      overflow-y: auto;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;
      overscroll-behavior-y: contain;
      background: linear-gradient(180deg, #050505, #000 72%);
    }

    .threads-video-wrap {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
    }
    .threads-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: .42;
      filter: brightness(.42) contrast(1.03) saturate(.85);
      transform: scale(1.06);
    }
    .threads-darkener {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(180deg, rgba(0,0,0,.44), rgba(0,0,0,.70)),
        radial-gradient(circle at center, rgba(0,0,0,.08) 0%, rgba(0,0,0,.24) 50%, rgba(0,0,0,.60) 100%);
    }

    .cloud-core {
      position: relative;
      z-index: 5;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 42px 0 130px;
    }

    .threads-title {
      width: min(1100px, 94vw);
      text-align: center;
      position: relative;
      z-index: 6;
    }
    .threads-title h2 {
      margin: 0;
      font-size: clamp(28px, 4vw, 58px);
      text-transform: uppercase;
      letter-spacing: .08em;
      font-family: Arial, Helvetica, sans-serif;
    }
    .threads-title p {
      margin: 14px 0 0;
      font-size: 17px;
      color: var(--muted);
      font-family: Arial, Helvetica, sans-serif;
    }
    .update-pill {
      margin-top: 18px;
      display: inline-block;
      padding: 12px 18px;
      border-radius: 999px;
      background: rgba(0,0,0,.32);
      border: 1px solid rgba(255,255,255,.12);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .14em;
      font-size: 12px;
      font-family: Arial, Helvetica, sans-serif;
    }

    /* Desktop board */
    .thread-board {
      position: relative;
      width: min(1240px, 96vw);
      height: 1020px;
      margin-top: 26px;
      z-index: 8;
    }

    .thread-knot {
      position: absolute;
      left: 50%;
      top: 5%;
      transform: translateX(-50%);
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff 0%, #dcb98c 35%, #6b402a 100%);
      box-shadow: 0 0 12px rgba(255,255,255,.16), 0 0 30px rgba(213,167,103,.18);
      z-index: 9;
    }

    .yarn-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 7;
      overflow: visible;
    }
    .yarn {
      fill: none;
      stroke: rgba(180,140,110,.86);
      stroke-width: 3;
      stroke-linecap: round;
      filter: drop-shadow(0 0 4px rgba(0,0,0,.5));
    }
    .yarn-shadow {
      fill: none;
      stroke: rgba(0,0,0,.48);
      stroke-width: 6;
      stroke-linecap: round;
    }

    .thread-node {
      position: absolute;
      width: 200px;
      padding: 12px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.10);
      background: linear-gradient(180deg, rgba(18,18,18,.90), rgba(8,8,8,.82));
      backdrop-filter: blur(6px);
      box-shadow: 0 18px 42px rgba(0,0,0,.34);
      color: var(--text);
      text-align: center;
      cursor: pointer;
      transition: transform .35s ease, background .35s ease, border-color .35s ease, box-shadow .35s ease;
      transform: translate3d(0,0,0);
      touch-action: none;
      z-index: 10;
    }
    .thread-node::before, .thread-node::after {
      content: "";
      position: absolute;
      top: -8px;
      width: 48px;
      height: 14px;
      border-radius: 3px;
      background: linear-gradient(180deg, rgba(226,211,177,.82), rgba(196,175,135,.62));
      box-shadow: 0 2px 8px rgba(0,0,0,.25);
      opacity: .92;
      pointer-events: none;
    }
    .thread-node::before { left: 14px; transform: rotate(-8deg); }
    .thread-node::after { right: 14px; transform: rotate(9deg); }
    .thread-node .pin {
      position: absolute;
      top: 9px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fff 0%, #efc88d 30%, #8b2b20 68%, #4a120d 100%);
      box-shadow: 0 0 0 2px rgba(0,0,0,.18), 0 3px 10px rgba(0,0,0,.35);
      pointer-events: none;
      z-index: 2;
    }
    .thread-node .pin.left { left: 16px; }
    .thread-node .pin.right { right: 16px; }
    .thread-node .stub {
      position: absolute;
      top: -26px;
      left: 50%;
      transform: translateX(-50%);
      width: 3px;
      height: 30px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(175,135,105,.98), rgba(117,74,50,.88));
      box-shadow: 0 0 4px rgba(0,0,0,.35);
      pointer-events: none;
      opacity: .95;
    }
    .thread-node:hover {
      transform: translateY(-8px) scale(1.03);
      background: rgba(20,20,20,.88);
      border-color: rgba(255,255,255,.18);
      box-shadow: 0 28px 62px rgba(0,0,0,.45);
    }
    .thread-node.dragging {
      transition: none;
      box-shadow: 0 40px 80px rgba(0,0,0,.58);
    }
    .thread-node img {
      width: 100%;
      aspect-ratio: .76 / 1;
      object-fit: cover;
      display: block;
      border-radius: 12px;
      margin-bottom: 10px;
      background: #111;
      box-shadow: 0 10px 22px rgba(0,0,0,.28);
    }
    .thread-node .mini {
      display: block;
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: .14em;
      margin-bottom: 6px;
      font-family: Arial, Helvetica, sans-serif;
    }
    .thread-node b {
      display: block;
      font-size: 15px;
      line-height: 1.1;
      font-family: Arial, Helvetica, sans-serif;
    }
    .thread-node.important {
      width: 220px;
      border-color: rgba(218,172,114,.30);
      box-shadow: 0 20px 56px rgba(125,78,32,.20), 0 18px 42px rgba(0,0,0,.34);
    }

    /* Desktop positions — spread out to prevent overlap */
    #node-trailer1 { left: 1%;   top: 18%; }
    #node-trailer2 { left: 16%;  top: 8%; }
    #node-sample   { left: 50%;  top: 5%; transform: translateX(-50%); }
    #node-analysis { right: 16%; top: 8%; left: auto; }
    #node-july     { right: 1%;  top: 18%; left: auto; }
    #node-dopesick { left: 50%;  top: 42%; transform: translateX(-50%); }
    #node-gods     { left: 50%;  top: 72%; transform: translateX(-50%); }

    /* ===================== VIEWERS ===================== */

    /* Book viewer — full fixed overlay */
    .book-viewer {
      position: fixed;
      inset: 0;
      z-index: 260;
      opacity: 0;
      pointer-events: none;
      transition: opacity .4s ease;
      display: flex;
      flex-direction: column;
    }
    .book-viewer.show {
      opacity: 1;
      pointer-events: auto;
    }
    .book-backdrop {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,.88);
      backdrop-filter: blur(14px);
    }

    .book-shell {
      position: relative;
      z-index: 2;
      margin: 3vh 3vw;
      flex: 1;
      border-radius: 24px;
      background: linear-gradient(180deg, #17110d, #0d0a08 62%, #080707);
      border: 1px solid rgba(255,255,255,.08);
      box-shadow: var(--shadow-deep);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }

    /* Shell header row */
    .book-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px 10px;
      flex-shrink: 0;
      border-bottom: 1px solid rgba(255,255,255,.06);
      gap: 10px;
      flex-wrap: wrap;
    }
    .book-header-left { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

    /* Buttons */
    .book-btn {
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(255,255,255,.05);
      color: #fff;
      border-radius: 999px;
      padding: 9px 16px;
      cursor: pointer;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      letter-spacing: .10em;
      text-transform: uppercase;
      white-space: nowrap;
      text-decoration: none;
      display: inline-block;
    }
    .book-btn:hover {
      background: rgba(255,255,255,.10);
    }

    /* Cover panel */
    .book-cover-panel {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 20px;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }
    .book-cover-panel img {
      max-height: 65vh;
      max-width: 100%;
      width: auto;
      object-fit: contain;
      border-radius: 16px;
      background: #111;
      box-shadow: var(--shadow);
    }
    .book-cover-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* Reading panel */
    .book-pages-panel {
      display: none;
      flex: 1;
      min-height: 0;
      flex-direction: column;
      overflow: hidden;
    }
    .book-viewer.reading .book-cover-panel { display: none; }
    .book-viewer.reading .book-pages-panel { display: flex; }

  function splitIntoPages(text, charsPerPage) {
    const cleaned = text.replace(/\r/g, "").trim();
    const chunks = [];
    let remaining = cleaned;
    while (remaining.length > charsPerPage) {
      let slice = remaining.slice(0, charsPerPage);
      let breakAt = Math.max(
        slice.lastIndexOf("\n\n"),
        slice.lastIndexOf(". "),
        slice.lastIndexOf("? "),
        slice.lastIndexOf("! ")
      );
      if (breakAt < charsPerPage * 0.55) breakAt = charsPerPage;
      chunks.push(remaining.slice(0, breakAt).trim());
      remaining = remaining.slice(breakAt).trim();
    }
    if (remaining.length) chunks.push(remaining);
    return chunks;
  }

  let state       = 0;

  /* ======================================================
     AUDIO
  ====================================================== */
  function setAudioButton() {
    audioToggle.textContent = audioOn ? 'Podcast: On' : 'Podcast: Off';
  }
  async function tryStartAudio() {
    try {
      podcastAudio.volume = 0.85;
      await podcastAudio.play();
      audioOn = true;
    } catch(e) { audioOn = false; }
    setAudioButton();
  }
  function toggleAudio() {
    if (audioOn) {
      podcastAudio.pause();
      audioOn = false;
      setAudioButton();
    } else {
      podcastAudio.play().then(() => { audioOn = true; setAudioButton(); }).catch(() => { audioOn = false; setAudioButton(); });
    }
  }

  /* ======================================================
     FLOW
  ====================================================== */
  function resetAll() {
    state = 0;
    pickupScene.classList.add('show');
    pickupScene.classList.remove('animate-out');
    atmScene.classList.remove('show', 'animate-insert', 'finish-insert', 'reveal-dvd');
    cloudScene.classList.remove('show');
    dvdCase.classList.remove('open');
    pickupCta.classList.remove('hidden');
    dvdCtaOverlay.classList.add('hidden');
    enterArchiveOverlay.classList.remove('visible');
    closeBook();
    closeVideo();
    hint.textContent = 'Tap the ticket to begin';
    try { bgVideo.play(); } catch(e) {}
    try { threadsVideo.play(); } catch(e) {}

  function beginSequence() {
    if (state !== 0) return;
    state = 1;
    pickupCta.classList.add('hidden');
    pickupScene.classList.add('animate-out');
    hint.textContent = 'Picking up the ticket…';

    setTimeout(() => {

  function openCase() {

    state = 2;
    dvdCtaOverlay.classList.add('hidden');

  function showThreads() {
    atmScene.classList.remove('show');
    cloudScene.classList.add('show');
    enterArchiveOverlay.classList.remove('visible');
    hint.textContent = 'Pull a thread';
    setTimeout(drawYarn, 80);

  /* ======================================================
     BOOK READER
  ====================================================== */
  function openThread(key) {
    currentKey = key;
    const book = booksRaw[key];
    pages = buildPages(key);
    pageIndex = 0;

    viewerCover.src = book.cover;
    viewerCover.alt = book.title;

    if (book.url) {
      externalLinkBtn.classList.remove('hidden');
      externalLinkBtn.href = book.url;
      externalLinkBtn2.classList.remove('hidden');
      externalLinkBtn2.href = book.url;
    } else {
      externalLinkBtn.classList.add('hidden');
      externalLinkBtn.href = '#';
      externalLinkBtn2.classList.add('hidden');
      externalLinkBtn2.href = '#';
    }

    bookViewer.classList.add('show');
    bookViewer.classList.remove('reading');
    bookControls.style.display = 'none';

    // On mobile, skip cover and go straight to reading
    if (isMobileDevice()) {
      startReading();
    }
  }

  function startReading() {
    if (!currentKey) return;
    // Rebuild pages in case orientation changed
    pages = buildPages(currentKey);
    pageIndex = 0;
    bookViewer.classList.add('reading');
    bookControls.style.display = 'flex';
    renderPage();
  }

  function renderPage() {
    const book = booksRaw[currentKey];
    pageKicker.textContent = book.kicker;
    pageTitle.textContent  = book.title;
    pageText.textContent   = pages[pageIndex] || '';
    bookStatus.textContent = `Page ${pageIndex + 1} / ${pages.length}`;
    prevPageBtn.disabled   = (pageIndex === 0);
    nextPageBtn.disabled   = (pageIndex + 1 >= pages.length);
    // Scroll reading area back to top on new page
    bookPageScroll.scrollTop = 0;
  }

  function nextPage() {
    if (!currentKey || pageIndex + 1 >= pages.length) return;
    pageIndex++;
    renderPage();
  }
  function prevPage() {
    if (!currentKey || pageIndex === 0) return;
    pageIndex--;
    renderPage();
  }

  function closeBook() {
    bookViewer.classList.remove('show', 'reading');
    bookControls.style.display = 'none';
    currentKey = null;
    pages = [];
    pageIndex = 0;
    externalLinkBtn.classList.add('hidden');
    externalLinkBtn2.classList.add('hidden');
  }

  /* ======================================================
     VIDEO
  ====================================================== */
  function openVideo(url) {
    trailerFrame.src = url;
    videoViewer.classList.add('show');
  }
  function closeVideo() {
    videoViewer.classList.remove('show');
    trailerFrame.src = '';
  }

  /* ======================================================
     YARN / THREAD BOARD
  ====================================================== */
  function drawYarn() {
    if (!threadKnot || !yarnLayer) return;
    const boardRect = threadBoard.getBoundingClientRect();
    const knotRect  = threadKnot.getBoundingClientRect();
    if (!boardRect.width) return;
    const x1 = knotRect.left - boardRect.left + knotRect.width / 2;
    const y1 = knotRect.top  - boardRect.top  + knotRect.height / 2;

    yarnLayer.setAttribute('viewBox', `0 0 ${boardRect.width} ${boardRect.height}`);
    yarnLayer.innerHTML = '';

    threadNodes.forEach(node => {
      const r = node.getBoundingClientRect();
      if (!r.width) return;
      const x2 = r.left - boardRect.left + r.width / 2;
      const y2 = r.top  - boardRect.top  + 8;
      const midY = y1 + (y2 - y1) * 0.5;
      const curve = Math.abs(x2 - x1) * 0.14 + 30;
      const path = `M ${x1} ${y1} C ${x1} ${midY}, ${x2} ${midY - curve}, ${x2} ${y2}`;

      const shadow = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      shadow.setAttribute('class', 'yarn-shadow');
      shadow.setAttribute('d', path);
      const yarn = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      yarn.setAttribute('class', 'yarn');
      yarn.setAttribute('d', path);
      yarnLayer.appendChild(shadow);
      yarnLayer.appendChild(yarn);
    });
  }

  /* ======================================================
     DRAGGABLE THREADS (desktop) / CLICK (mobile)
  ====================================================== */
  function wireDraggableThread(node) {
    if (isMobileDevice()) {
      node.addEventListener('click', () => {
        if (node.dataset.video) openVideo(node.dataset.video);
        if (node.dataset.book)  openThread(node.dataset.book);
      });
      return;
    }

    let startX = 0, startY = 0, moved = false, pointerId = null;

    node.addEventListener('pointerdown', (e) => {
      pointerId = e.pointerId;
      startX = e.clientX;
      startY = e.clientY;
      moved = false;
      node.classList.add('dragging');
      node.setPointerCapture(pointerId);
    });
    node.addEventListener('pointermove', (e) => {
      if (pointerId === null || e.pointerId !== pointerId) return;
      const dx = Math.max(-22, Math.min(22, e.clientX - startX));
      const dy = Math.max(-10, Math.min(34, e.clientY - startY));
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
      node.style.transform = `translate(${dx}px, ${dy}px)`;
      drawYarn();
    });
    node.addEventListener('pointerup', (e) => {
      if (pointerId === null || e.pointerId !== pointerId) return;
      node.releasePointerCapture(pointerId);
      pointerId = null;
      node.classList.remove('dragging');
      node.style.transform = '';
      drawYarn();
      if (!moved) {
        if (node.dataset.video) openVideo(node.dataset.video);
        if (node.dataset.book)  openThread(node.dataset.book);
      }
    });
    node.addEventListener('pointercancel', () => {
      node.classList.remove('dragging');
      node.style.transform = '';
      pointerId = null;
      drawYarn();
    });
  }

  /* ======================================================
     EVENT WIRING
  ====================================================== */
  audioToggle.addEventListener('click', toggleAudio);

  groundTicket.addEventListener('click', () => {
    beginSequence();
    if (!audioOn) tryStartAudio();
  });

  dvdCase.addEventListener('click', openCase);
  enterThreadsBtn.addEventListener('click', showThreads);
  enterThreadsBtnMobile.addEventListener('click', showThreads);
  resetBtn.addEventListener('click', resetAll);

  videoClose.addEventListener('click', closeVideo);
  videoBackdrop.addEventListener('click', closeVideo);

  openBookBtn.addEventListener('click', startReading);
  openBookBtn2.addEventListener('click', startReading);
  bookClose.addEventListener('click', closeBook);
  bookBackdrop.addEventListener('click', closeBook);
  nextPageBtn.addEventListener('click', nextPage);
  prevPageBtn.addEventListener('click', prevPage);

  bgVideo.addEventListener('error', () => bgVideo.style.display = 'none');
  threadsVideo.addEventListener('error', () => threadsVideo.style.display = 'none');

  threadNodes.forEach(wireDraggableThread);

  window.addEventListener('resize', () => {
    drawYarn();
    // Rewire thread nodes on orientation change
    threadNodes.forEach(node => {
      node.replaceWith(node.cloneNode(true));
    });
    Array.from(document.querySelectorAll('.thread-node')).forEach(wireDraggableThread);
  });

  /* ======================================================
     INIT
  ====================================================== */
  resetAll();
  tryStartAudio();
  try { bgVideo.play(); } catch(e) {}
  try { threadsVideo.play(); } catch(e) {}
  setTimeout(drawYarn, 200);
