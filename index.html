<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>IM HIGH ON CRACK AND I HAVE A GUN</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  background: #000;
  overflow: hidden;
  font-family: Arial, sans-serif;
}

/* ===== ENTRY SCREEN ===== */
.entry {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  background: url("entry.jpg") center/cover no-repeat;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

/* Grain */
.entry::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image: url('https://grainy-gradients.vercel.app/noise.svg');
  opacity: 0.25;
  pointer-events: none;
}

/* Vignette */
.entry::after {
  content: "";
  position: absolute;
  inset: 0;
  background: radial-gradient(circle, transparent 40%, black 90%);
  pointer-events: none;
}

/* Tap text */
.tap-text {
  position: absolute;
  bottom: 8%;
  color: #fff;
  font-size: 14px;
  letter-spacing: 3px;
  text-transform: uppercase;
  opacity: 0.75;
}

/* Fade */
.fade-out {
  animation: fadeOut 0.4s forwards;
}

@keyframes fadeOut {
  to {
    opacity: 0;
    transform: scale(1.02);
  }
}

/* ===== MAIN EXPERIENCE ===== */
.main {
  position: fixed;
  inset: 0;
  background: #0a0a0a;
  color: #fff;
  display: none;
  overflow-y: auto;
  padding: 40px 20px;
}

.main.active {
  display: block;
}

/* ===== SOUNDTRACK ===== */
.section {
  max-width: 700px;
  margin: 0 auto 60px;
  text-align: center;
}

.section h2 {
  font-size: 22px;
  letter-spacing: 3px;
  margin-bottom: 10px;
}

.section p {
  opacity: 0.7;
  margin-bottom: 20px;
}

/* Audio */
audio {
  width: 100%;
  margin-top: 10px;
}

/* ===== EMAIL ===== */
.email-box {
  margin-top: 30px;
}

input {
  width: 100%;
  padding: 14px;
  background: #111;
  border: 1px solid #333;
  color: white;
  margin-bottom: 10px;
}

button {
  width: 100%;
  padding: 14px;
  background: #fff;
  color: #000;
  border: none;
  font-weight: bold;
  cursor: pointer;
}

.entry-count {
  margin-top: 10px;
  font-size: 12px;
  opacity: 0.6;
}

</style>
</head>

<body>

<!-- ENTRY SCREEN -->
<div class="entry" id="entry">
  <div class="tap-text">tap to enter</div>
</div>

<!-- MAIN EXPERIENCE -->
<div class="main" id="main">

  <!-- SOUNDTRACK -->
  <div class="section">
    <h2>THE SOUNDTRACK</h2>
    <p>This is the sound behind the collapse</p>

    <audio controls>
      <source src="track.mp3" type="audio/mpeg">
    </audio>

    <!-- EMAIL -->
    <div class="email-box">
      <form action="https://formsubmit.co/imhighoncrackandihaveagun@gmail.com" method="POST">
        <input type="hidden" name="_captcha" value="false">
        <input type="hidden" name="_subject" value="New Entry Signup">
        <input type="hidden" name="_template" value="table">

        <input type="email" name="email" placeholder="enter your email" required>
        <button type="submit">unlock full access</button>
      </form>

      <div class="entry-count" id="entryCount"></div>
    </div>

  </div>

</div>

<script>
const entry = document.getElementById("entry");
const main = document.getElementById("main");

entry.addEventListener("click", () => {
  entry.classList.add("fade-out");

  setTimeout(() => {
    entry.style.display = "none";
    main.classList.add("active");
    document.body.style.overflow = "auto";
  }, 400);
});

/* Fake entry counter (visual psychology) */
const count = localStorage.getItem("entryCount") || Math.floor(Math.random()*200 + 100);
document.getElementById("entryCount").innerText = "Entry #" + count;
localStorage.setItem("entryCount", count);
</script>

</body>
</html>
